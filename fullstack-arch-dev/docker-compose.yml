# version: "3.9"

services:
  superset:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: superset
    ports:
      - "8088:8088"
    env_file:
      - .env
    volumes:
      - ./data:/home/devuser/workspace
      - ./superset:/home/devuser/.superset
    depends_on:
      - mysql
      - postgres
      - redis
    restart: always
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    networks:
      - superset_net

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - superset_net

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - superset_net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - superset_net

